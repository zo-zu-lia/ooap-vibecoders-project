# Optional local operations profile. Bind every dashboard to loopback.
services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - metrics:/prometheus
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=30d, --storage.tsdb.retention.size=1GB]
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 256m
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    volumes: [./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ["127.0.0.1:9093:9093"]
    mem_limit: 64m
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    command: [--path.rootfs=/host, --collector.textfile.directory=/textfile]
    volumes:
      - /:/host:ro,rslave
      - ./.local/metrics:/textfile:ro
    mem_limit: 64m
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.26.0@sha256:92e05d5fe0df01d3980518dc42f07b778a8997048b57392ebc7f7391ebd7bb06
    volumes: [./infra/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro]
    mem_limit: 48m
    restart: unless-stopped
volumes:
  metrics:

