      summary: Читати журнал аудиту
      description: Лише security admin; журнал має append-only записи без токенів і вмісту документів.
      operationId: get_audit_events
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Сторінка журналу.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
