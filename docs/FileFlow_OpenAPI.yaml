# OpenAPI 3.0.3 contract — FileFlow (MVP)
# Implemented REST contract; local profile differences are documented in LOCAL_DEVELOPMENT.md.
openapi: 3.0.3
info:
  title: FileFlow — внутрішній корпоративний файловий сервіс
  version: 1.0.0
  description: Контракт REST API для MVP однієї компанії. Доступ тільки через корпоративну BFF-сесію.
    Вміст файлів передається безпосередньо до приватного S3-сумісного сховища за короткоживучими підписаними URL.
    Усі URL, домени й ідентифікатори в прикладах вигадані.
    Локальний ClamAV обмежує файл до 2147483645 байтів (2 GiB мінус 3 байти).
servers:
- url: http://localhost:8080/api/v1
  description: Локальна Docker-реалізація; HTTP лише на loopback
- url: https://files.example.corp/api/v1
  description: Умовна адреса корпоративного розгортання (приклад, не реальний сервер)
security:
- SessionCookie: []
- LocalSessionCookie: []
tags:
- name: Identity
  description: Сесія та користувач
- name: Workspace
  description: Робочі простори, папки та політики
- name: Uploads
  description: Завантаження частинами
- name: Files
  description: Файли, версії та кошик
- name: Access
  description: Права й внутрішні посилання
- name: Search
  description: Пошук метаданих
- name: Audit
  description: Журнал аудиту
paths:
  /me:
    get:
      tags:
      - Identity
      summary: Поточний користувач
      description: Повертає локальну проєкцію корпоративної особи; не є endpoint входу.
      operationId: get_me
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Поточний користувач.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /logout:
    post:
      tags:
      - Identity
      summary: Завершити сесію
      description: Скасовує серверну сесію та очищує session cookie.
      operationId: post_logout
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '204':
          description: Сеанс завершено.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/Csrf'
  /workspaces:
    get:
      tags:
      - Workspace
      summary: Доступні простори
      description: Повертає лише робочі простори, доступні через членство й корпоративні групи.
      operationId: get_workspaces
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Перелік просторів.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /workspaces/{workspaceId}/items:
    get:
      tags:
      - Workspace
      summary: Вміст папки
      description: За відсутності parentId повертає корінь простору; сортування за іменем. Повертає лише доступні
        об’єкти.
      operationId: get_workspaces_workspaceId_items
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Список папок та файлів.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - items
                - nextCursor
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: parentId
        in: query
        required: false
        description: Батьківська папка; відсутній параметр означає корінь.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
  /workspaces/{workspaceId}/folders:
    post:
      tags:
      - Workspace
      summary: Створити папку
      description: Доступ EDITOR або OWNER; назва унікальна серед дочірніх об’єктів.
      operationId: post_workspaces_workspaceId_folders
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: Папку створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId:
                  type: string
                  format: uuid
                  nullable: true
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
              required:
              - name
  /workspaces/{workspaceId}/policy:
    get:
      tags:
      - Workspace
      summary: Прочитати політику простору
      description: Керівник простору бачить чинні значення квоти та retention.
      operationId: get_workspaces_workspaceId_policy
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Поточна політика.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags:
      - Workspace
      summary: Оновити квоту й retention
      description: Тільки системний адміністратор. Нова політика retention діє для майбутніх soft-delete; purgeAt
        уже видалених файлів не перераховується.
      operationId: put_workspaces_workspaceId_policy
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Політику оновлено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
  /folders/{folderId}/uploads:
    post:
      tags:
      - Uploads
      summary: Почати створення файла
      description: Створює сесію multipart upload для нового файла; байти клієнт передає у сховище напряму.
      operationId: post_folders_folderId_uploads
      responses:
        '201':
          description: Сесію створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/FolderId'
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                sizeBytes:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 2147483645
                sha256:
                  type: string
                  pattern: ^[a-fA-F0-9]{64}$
                contentType:
                  type: string
                  maxLength: 200
              required:
              - name
              - sizeBytes
              - sha256
              - contentType
  /files/{fileId}/uploads:
    post:
      tags:
      - Uploads
      summary: Почати створення нової версії
      description: expectedVersionNo — відома клієнту версія для optimistic concurrency; остаточне порівняння здійснюється
        атомарно на complete.
      operationId: post_files_fileId_uploads
      responses:
        '201':
          description: Сесію для нової версії створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersionNo:
                  type: integer
                  minimum: 1
                sizeBytes:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 2147483645
                sha256:
                  type: string
                  pattern: ^[a-fA-F0-9]{64}$
                contentType:
                  type: string
                  maxLength: 200
              required:
              - expectedVersionNo
              - sizeBytes
              - sha256
              - contentType
  /uploads/{uploadId}/parts/{partNumber}/url:
    get:
      tags:
      - Uploads
      summary: Отримати URL частини
      description: Повертає PUT URL на конкретний номер частини тільки для власника сесії. Підписаний URL живе до
        15 хвилин; байти не йдуть через API.
      operationId: get_uploads_uploadId_parts_partNumber_url
      responses:
        '200':
          description: Параметри завантаження частини.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedPart'
          headers:
            Cache-Control:
              description: Відповідь з URL заборонено кешувати
              schema:
                type: string
                example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/UploadId'
      - $ref: '#/components/parameters/PartNumber'
  /uploads/{uploadId}/complete:
    post:
      tags:
      - Uploads
      summary: Завершити multipart upload
      description: Перевіряє склад частин, атомарно резервує номер нової версії (CAS), зберігає PENDING_SCAN і задачу
        сканування. Після 202 опитуйте GET /uploads/{uploadId}; це НЕ означає, що файл уже доступний.
      operationId: post_uploads_uploadId_complete
      responses:
        '202':
          description: Версію створено в стані PROCESSING; AV і SHA-256 ще не завершено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/UploadId'
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      partNumber:
                        type: integer
                        minimum: 1
                      etag:
                        type: string
                        minLength: 1
                    required:
                    - partNumber
                    - etag
              required:
              - parts
  /uploads/{uploadId}:
    get:
      tags:
      - Uploads
      summary: Стан завантаження
      description: Після сканування повертає READY або REJECTED та відповідний errorCode; 200 описує стан, а не
        успіх доменної операції.
      operationId: get_uploads_uploadId
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Поточний стан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/UploadId'
  /workspaces/{workspaceId}/trash:
    get:
      tags:
      - Workspace
      summary: Показати кошик робочого простору
      description: Повертає TRASHED файли з часом видалення і інформацією для recovery. Доступ тільки користувачам
        з відповідними правами.
      operationId: get_workspaces_workspaceId_trash
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Файли в кошику.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
  /files/{fileId}:
    get:
      tags:
      - Files
      summary: Метадані файла
      description: Включає latestVersionNo та downloadableVersionNo, що можуть різнитися під час сканування чи карантину.
      operationId: get_files_fileId
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Метадані файла.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/FileId'
    delete:
      tags:
      - Files
      summary: Перемістити файл у кошик
      description: Soft-delete. Негайно забороняє видачу нових signed URL і відкликає share links. purgeAt обчислюється
        з актуальної політики.
      operationId: delete_files_fileId
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '204':
          description: Файл у кошику.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/Csrf'
  /files/{fileId}/versions:
    get:
      tags:
      - Files
      summary: Історія версій
      description: Включає PENDING_SCAN та REJECTED без надання URL їхнього вмісту.
      operationId: get_files_fileId_versions
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Список версій.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/FileId'
  /files/{fileId}/versions/{versionNo}/restore:
    post:
      tags:
      - Files
      summary: Відновити попередню версію
      description: Для CLEAN версії створює новий незмінний запис, що посилається на вже перевірений об’єкт. Перевіряє
        expectedVersionNo в транзакції.
      operationId: post_files_fileId_versions_versionNo_restore
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: Нову поточну версію створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/VersionNo'
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersionNo:
                  type: integer
                  minimum: 1
              required:
              - expectedVersionNo
  /files/{fileId}/download-link:
    get:
      tags:
      - Files
      summary: Отримати посилання на завантаження
      description: Повертає короткоживучий GET URL лише для останньої CLEAN версії. При зміні ACL раніше виданий
        URL залишається придатним до завершення TTL (максимум 60 с).
      operationId: get_files_fileId_download_link
      responses:
        '200':
          description: Підписаний URL тільки для читання.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
          headers:
            Cache-Control:
              description: Відповідь з URL заборонено кешувати
              schema:
                type: string
                example: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
