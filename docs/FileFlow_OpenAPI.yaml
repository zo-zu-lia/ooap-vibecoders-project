        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: workspaceId
        in: query
        required: false
        description: Необов’язковий фільтр за простором.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-fileflow_session
      description: Безпечна httpOnly SameSite=Lax cookie; встановлюється бекендом після OIDC Authorization Code
        + PKCE. Логін/колбек OIDC — браузерні маршрути, не частина JSON API.
    LocalSessionCookie:
      type: apiKey
      in: cookie
      name: fileflow_session
      description: Лише локальний loopback HTTP-профіль; HTTPS використовує SessionCookie.
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF-токен BFF-сесії для операцій зміни стану.
      schema:
        type: string
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      description: Унікальний ключ запиту (UUID); відповідь повторюється протягом 24 годин для того ж запиту.
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Ідентифікатор робочого простору.
      schema:
        type: string
        format: uuid
    FolderId:
      name: folderId
      in: path
      required: true
      description: Ідентифікатор папки.
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      description: Ідентифікатор файла.
      schema:
        type: string
        format: uuid
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Ідентифікатор сесії завантаження.
      schema:
        type: string
        format: uuid
    ShareLinkId:
      name: shareLinkId
      in: path
      required: true
      description: Ідентифікатор внутрішнього посилання.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: Ідентифікатор працівника з корпоративного каталогу.
      schema:
        type: string
        format: uuid
    VersionNo:
      name: versionNo
      in: path
      required: true
      description: Номер версії файла (від 1).
      schema:
        type: integer
        minimum: 1
    PartNumber:
      name: partNumber
      in: path
      required: true
      description: Номер частини multipart upload (від 1 до partCount).
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозорий курсор сторінки.
      schema:
        type: string
  responses:
    BadRequest:
      description: Некоректний JSON, параметр або схема запиту.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            BadRequest:
              summary: Bad Request
              value:
                type: https://docs.example.corp/problems/bad-request
                title: Bad Request
                status: 400
                detail: Некоректний JSON, параметр або схема запиту.
                code: BAD_REQUEST
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
            ValidationFailed:
              summary: Некоректне поле запиту
              value:
                type: https://docs.example.corp/problems/validation-failed
                title: Bad Request
                status: 400
                detail: Поле sizeBytes не відповідає обмеженням.
                code: VALIDATION_FAILED
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
                invalidParams:
                - name: sizeBytes
                  reason: Максимум 2147483645 байтів
    Unauthorized:
      description: Необхідна чинна корпоративна сесія.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            Unauthorized:
              summary: Unauthenticated
              value:
                type: https://docs.example.corp/problems/unauthenticated
                title: Unauthorized
                status: 401
                detail: Необхідна чинна корпоративна сесія.
                code: UNAUTHENTICATED
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
    Forbidden:
      description: Немає дозволу на цю дію.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            Forbidden:
              summary: Access Denied
              value:
                type: https://docs.example.corp/problems/access-denied
                title: Forbidden
                status: 403
                detail: Немає дозволу на цю дію.
                code: ACCESS_DENIED
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
    NotFound:
      description: Об’єкт не знайдено або його існування приховано.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            NotFound:
              summary: Not Found
              value:
                type: https://docs.example.corp/problems/not-found
                title: Not Found
                status: 404
                detail: Об’єкт не знайдено або його існування приховано.
                code: NOT_FOUND
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
    Conflict:
      description: 'Конфлікт стану: застаріла версія, квота або процес видалення.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            Conflict:
              summary: Version Conflict
              value:
                type: https://docs.example.corp/problems/version-conflict
                title: Conflict
                status: 409
                detail: 'Конфлікт стану: застаріла версія, квота або процес видалення.'
                code: VERSION_CONFLICT
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
            VersionConflict:
              summary: Застаріла версія
              value:
                type: https://docs.example.corp/problems/version-conflict
                title: Conflict
                status: 409
                detail: expectedVersionNo=3; актуальна версія=4.
                code: VERSION_CONFLICT
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
                currentVersionNo: 4
            QuotaExceeded:
              summary: Перевищено квоту
              value:
                type: https://docs.example.corp/problems/quota-exceeded
                title: Conflict
                status: 409
                detail: Недостатньо вільного обсягу робочого простору.
                code: QUOTA_EXCEEDED
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
            IdempotencyKeyReused:
              summary: Повтор ключа з іншим тілом
              value:
                type: https://docs.example.corp/problems/idempotency-key-reused
                title: Conflict
                status: 409
                detail: Ключ уже використовувався для іншого запиту.
                code: IDEMPOTENCY_KEY_REUSED
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
            FilePurging:
              summary: Фізичне видалення вже почалося
              value:
                type: https://docs.example.corp/problems/file-purging
                title: Conflict
                status: 409
                detail: Відновлення після переходу до PURGING неможливе.
                code: FILE_PURGING
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
    Unprocessable:
      description: Вміст файла не пройшов перевірку цілісності або безпеки.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            Unprocessable:
              summary: Content Rejected
              value:
                type: https://docs.example.corp/problems/content-rejected
                title: Unprocessable Content
                status: 422
                detail: Вміст файла не пройшов перевірку цілісності або безпеки.
                code: CONTENT_REJECTED
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
            ChecksumMismatch:
              summary: Розбіжність SHA-256
              value:
                type: https://docs.example.corp/problems/checksum-mismatch
                title: Unprocessable Content
                status: 422
                detail: Контрольна сума завантаженого об’єкта не збігається.
                code: CHECKSUM_MISMATCH
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
            ContentRejected:
              summary: Неуспішне сканування
              value:
                type: https://docs.example.corp/problems/content-rejected
                title: Unprocessable Content
                status: 422
                detail: Файл не пройшов перевірку безпеки.
                code: CONTENT_REJECTED
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
            Quarantined:
              summary: Версія у карантині
              value:
                type: https://docs.example.corp/problems/quarantined
                title: Unprocessable Content
                status: 422
                detail: Запитана версія недоступна через карантин.
                code: QUARANTINED
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
    RateLimited:
      description: Перевищено ліміт запитів. Дотримуйтеся Retry-After.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            RateLimited:
              summary: Rate Limited
              value:
                type: https://docs.example.corp/problems/rate-limited
                title: Too Many Requests
                status: 429
                detail: Перевищено ліміт запитів. Дотримуйтеся Retry-After.
                code: RATE_LIMITED
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: true
      headers:
        Retry-After:
          description: Секунди до рекомендованої повторної спроби.
          schema:
            type: integer
            minimum: 1
            example: 30
    ServerError:
      description: Неочікувана помилка; внутрішні деталі приховано.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ServerError:
              summary: Internal Error
              value:
                type: https://docs.example.corp/problems/internal-error
                title: Internal Server Error
                status: 500
                detail: Неочікувана помилка; внутрішні деталі приховано.
                code: INTERNAL_ERROR
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: false
    ServiceUnavailable:
      description: Тимчасово недоступна залежність; безпечний повтор дозволено.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ServiceUnavailable:
              summary: Dependency Unavailable
              value:
                type: https://docs.example.corp/problems/dependency-unavailable
                title: Service Unavailable
                status: 503
                detail: Тимчасово недоступна залежність; безпечний повтор дозволено.
                code: DEPENDENCY_UNAVAILABLE
                requestId: c55b68c2-3f52-453b-91db-3f3b1718570a
                retryable: true
      headers:
        Retry-After:
          description: Секунди до рекомендованої повторної спроби.
          schema:
            type: integer
            minimum: 1
            example: 30
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        csrfToken:
          type: string
          description: Токен для заголовка X-CSRF-Token; передається лише автентифікованому SPA.
      required:
      - id
      - displayName
      - email
      - status
      - csrfToken
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        myRole:
          type: string
          enum:
          - VIEWER
          - EDITOR
          - OWNER
        quotaBytes:
          type: integer
          format: int64
        usedBytes:
          type: integer
          format: int64
      required:
      - id
      - name
      - myRole
      - quotaBytes
      - usedBytes
    Folder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
      required:
      - id
      - workspaceId
      - parentId
      - name
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - FILE
          - FOLDER
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
        fileStatus:
          type: string
          enum:
          - PENDING_SCAN
          - CLEAN
          - REJECTED
          - TRASHED
          nullable: true
      required:
      - id
      - kind
      - name
      - updatedAt
    UploadSession:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - INITIATED
          - PROCESSING
          - READY
          - REJECTED
          - CONFLICT
          - EXPIRED
        partSizeBytes:
          type: integer
          format: int64
        partCount:
          type: integer
        expiresAt:
          type: string
          format: date-time
        fileId:
          type: string
          format: uuid
          nullable: true
        versionNo:
          type: integer
          nullable: true
        errorCode:
          type: string
          nullable: true
      required:
      - uploadId
      - status
      - partSizeBytes
      - partCount
      - expiresAt
    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
        folderId:
          type: string
          format: uuid
        name:
          type: string
        latestVersionNo:
          type: integer
        downloadableVersionNo:
          type: integer
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        legalHold:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - folderId
      - name
      - latestVersionNo
      - legalHold
      - updatedAt
    Version:
      type: object
      properties:
        versionNo:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        status:
          type: string
          enum:
          - PENDING_SCAN
          - CLEAN
          - REJECTED
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
      required:
      - versionNo
      - sizeBytes
      - sha256
      - status
      - createdAt
      - createdBy
    SignedPart:
      type: object
      properties:
        method:
          type: string
          enum:
          - PUT
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        requiredHeaders:
          type: object
          properties:
            Content-Type:
              type: string
          required:
          - Content-Type
      required:
      - method
      - url
      - expiresAt
      - requiredHeaders
    DownloadLink:
      type: object
      properties:
        method:
          type: string
          enum:
          - GET
        url:
          type: string
          format: uri
        versionNo:
          type: integer
        expiresAt:
          type: string
          format: date-time
      required:
      - method
      - url
      - versionNo
      - expiresAt
    ShareLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        recipientUserId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
      required:
      - id
      - url
      - recipientUserId
      - expiresAt
    ShareLinkSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientUserId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - recipientUserId
      - expiresAt
      - revokedAt
    PermissionEntry:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - VIEWER
          - EDITOR
      required:
      - userId
      - role
    ShareResolution:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        fileName:
          type: string
        download:
          $ref: '#/components/schemas/DownloadLink'
      required:
      - fileId
      - fileName
      - download
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorUserId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        targetId:
          type: string
          format: uuid
          nullable: true
        result:
          type: string
        requestId:
          type: string
          format: uuid
      required:
      - id
      - at
      - action
      - result
      - requestId
    Policy:
      type: object
      properties:
        quotaBytes:
          type: integer
          format: int64
          minimum: 1
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
      required:
      - quotaBytes
      - retentionDays
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          example: https://docs.example.corp/problems/version-conflict
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Версія файла змінилася після початку завантаження.
        instance:
          type: string
          example: /api/v1/uploads/00000000-0000-4000-8000-000000000010/complete
        code:
          type: string
          example: VERSION_CONFLICT
        requestId:
          type: string
          format: uuid
        retryable:
          type: boolean
          example: false
        currentVersionNo:
          type: integer
          minimum: 1
          description: Для VERSION_CONFLICT — актуальна версія файла.
        invalidParams:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
            required:
            - name
            - reason
      required:
      - type
      - title
      - status
      - detail
      - code
      - requestId
      - retryable
