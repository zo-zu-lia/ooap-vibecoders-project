name: fileflow
x-app: &app
  image: fileflow:local
  build: .
  env_file: .env
  restart: unless-stopped
  init: true
  mem_limit: 384m
  cpus: 1.0
  pids_limit: 100
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp:size=64m,mode=1777]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fileflow
      POSTGRES_USER: fileflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py first}
    volumes: [pgdata:/var/lib/postgresql/data]
    command: [postgres, -c, shared_buffers=96MB, -c, max_connections=40, -c, work_mem=4MB]
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fileflow -d fileflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: fileflow-storage:local
    build:
      context: .
      dockerfile: infra/storage.Dockerfile
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080
    ports: ["127.0.0.1:9000:9000"]
    volumes: [objects:/data]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
  dex:
    image: ghcr.io/dexidp/dex:v2.43.1
    entrypoint: [/usr/local/bin/dex]
    command: [serve, /etc/dex/config.yaml]
    user: "1000:1000"
    volumes:
      - ./.local/dex.yaml:/etc/dex/config.yaml:ro
      - ./.local/dex-data:/var/dex
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  antivirus:
    image: clamav/clamav:stable_base
    volumes:
      - avdata:/var/lib/clamav
      - ./infra/clamd.conf:/etc/clamav/clamd.conf:ro
    mem_limit: 2304m
    cpus: 1.5
    restart: unless-stopped
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
  migrate:
    <<: *app
    command: [python, -m, app.db]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage: {condition: service_healthy}
      dex: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: [python, -m, app.worker]
    stop_grace_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage: {condition: service_healthy}
      antivirus: {condition: service_healthy}
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: [./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
      dex: {condition: service_started}

volumes:
  pgdata:
  objects:
  avdata:

